<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>かくれさま シーンエディタ</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <header class="toolbar">
    <h1>シーンエディタ</h1>
    <select id="server-scenes" title="scenes/ フォルダのシーンを開く">
      <option value="">サーバー上のシーンを開く…</option>
    </select>
    <label class="btn">画像を開く<input type="file" id="file-img" accept="image/*" hidden></label>
    <label class="btn">scene.json を開く<input type="file" id="file-json" accept=".json,application/json" hidden></label>
    <span class="sep"></span>
    <div class="tools" role="radiogroup" aria-label="ツール">
      <label><input type="radio" name="tool" value="select"> 選択 <kbd>V</kbd></label>
      <label><input type="radio" name="tool" value="rect" checked> 四角 <kbd>R</kbd></label>
      <label><input type="radio" name="tool" value="circle"> 円 <kbd>C</kbd></label>
      <label><input type="radio" name="tool" value="poly"> 多角形 <kbd>P</kbd></label>
    </div>
    <span class="sep"></span>
    <button id="zoom-out" class="btn" title="縮小">－</button>
    <span id="zoom-label" class="zoom-label">100%</span>
    <button id="zoom-in" class="btn" title="拡大">＋</button>
    <button id="zoom-fit" class="btn">全体</button>
    <span class="grow"></span>
    <button id="btn-preview" class="btn">テストプレイ</button>
    <button id="btn-copy" class="btn">JSONをコピー</button>
    <button id="btn-export" class="btn primary">scene.json を保存</button>
  </header>

  <main class="layout">
    <div id="canvas-wrap" class="canvas-wrap">
      <div id="canvas" class="canvas">
        <img id="img" alt="" draggable="false">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div id="empty" class="empty">
        <p>GPTで作った背景画像をここにドロップ</p>
        <p class="small">または「画像を開く」／「サーバー上のシーンを開く」</p>
      </div>
    </div>

    <aside class="side">
      <section>
        <h2>シーン情報</h2>
        <div class="form">
          <label>ID<input id="f-id" placeholder="ch2"></label>
          <label>タイトル<input id="f-title" placeholder="第二夜　土間と台所"></label>
          <label>画像ファイル名<input id="f-image" placeholder="bg.webp"></label>
          <label>出題数<input id="f-pick" type="number" min="1" placeholder="10"></label>
          <label class="check"><input id="f-flashlight" type="checkbox"> 懐中電灯モード（暗闇）</label>
          <label class="wide">導入文（1行＝1画面、画面内の改行は \n）<textarea id="f-intro" rows="4"></textarea></label>
          <label class="wide">締めの文<textarea id="f-outro" rows="3"></textarea></label>
        </div>
      </section>

      <section class="items-section">
        <h2>アイテム <span id="item-count" class="count"></span></h2>
        <ol id="items" class="items"></ol>
      </section>

      <section>
        <p id="status" class="status"></p>
        <details class="help">
          <summary>操作方法</summary>
          <ul>
            <li>四角・円：ドラッグで囲む</li>
            <li>多角形：クリックで頂点を追加 → 始点クリック／ダブルクリック／Enter で確定</li>
            <li>選択ツール：図形をドラッグで移動、<kbd>Delete</kbd> で削除</li>
            <li><kbd>Esc</kbd>：描きかけを取り消し</li>
            <li><kbd>Ctrl</kbd>/<kbd>⌘</kbd>＋ホイール：ズーム</li>
            <li>赤枠のアイテムは「物語アイテム」。必ず出題され、見つけると一文が表示されます</li>
          </ul>
        </details>
      </section>
    </aside>
  </main>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
