# ゲームの自動テストと、各ストア向けアプリのビルド確認。
# 署名やストアへのアップロードはここでは行わない（docs/RELEASE.md 参照）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ゲームのテスト（ブラウザ・PC版）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: PC版（Electron）の起動確認
        run: xvfb-run -a node tools/electron-smoke.mjs

  android:
    name: Android ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android && node tools/patch-native.mjs
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        # 成果物の保管は確認用のおまけ。保管容量の上限に達してもビルドの成否には影響させない
        continue-on-error: true
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 3 # Actions ストレージ対策(2026-10-15): 既定90日だと APK が積み上がる(実測15本=1.6GB)。3日で消す

  ios:
    name: iOS ビルド（シミュレーター・署名なし）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npx cap sync ios && node tools/patch-native.mjs
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  desktop:
    name: PC版ビルド（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        # 成果物の保管は確認用のおまけ。保管容量の上限に達してもビルドの成否には影響させない
        continue-on-error: true
        with:
          name: desktop-${{ matrix.os }}
          path: dist/*-unpacked/
          if-no-files-found: ignore
          retention-days: 3 # 同上
